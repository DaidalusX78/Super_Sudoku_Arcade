<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Super Sudoku Arcade</title>
</head>
<body>

<div class="game-container">
  
  <!-- Top HUD & Timer -->
  <div class="hud-wrapper">
      
    <!-- High Score, Mute Toggle & Timer Row -->
    <div class="hud top-hud-row">
      <div class="clock-group">
        <!-- Digital Clock Display -->
        <div class="digital-clock" id="time-display">00:00</div>
      </div>
        
      <span class="label hi-score-label">
        HI-SCORE: <span id="hi-score-display" class="hi-score-val">000000</span>
      </span>
      <!-- Mute & Quit Buttons -->
      <div class="hud-btn-group">
        <button id="mute-btn" class="hud-icon-btn" onclick="toggleMute()" title="Toggle Audio">🔊</button>
        <button id="quit-btn" class="hud-icon-btn hud-quit-btn" onclick="requestQuit()" title="Quit to Menu">QUIT</button>
      </div>
    </div>

    <!-- Player Stats -->
    <div class="hud stats-hud-row">
      <div class="hud-element">
        <span class="label">PLAYER 1</span>
        <span class="value" id="score-display">000000</span>
      </div>
      
      <!-- Strike Counter -->
      <div class="hud-element strike-element">
        <span class="label">STRIKES</span>
        <div id="strikes-display" class="strike-tracker">
          <div class="strike-box"></div>
          <div class="strike-box"></div>
          <div class="strike-box"></div>
        </div>
      </div>

      <div class="hud-element multiplier-element">
        <span class="label">Multiplier</span>
        <span class="value combo-value">x1</span>
      </div>
    </div>

    <div class="timer-container">
      <div class="timer-bar"></div>
    </div>
  </div> <!-- Closes hud-wrapper -->

  <!-- 9x9 Board -->
  <div class="board" id="sudoku-board"></div>

  <!-- Action Bar: Glass Pencil Notes Toggle -->
  <div class="action-bar">
    <button class="action-bar-btn notes-btn" id="notes-btn" onclick="toggleNotesMode()" title="Toggle Glass Pencil (Hotkeys: N or Shift+1-9)">
      <span class="action-btn-icon">✏️</span>
      <span class="action-btn-text">GLASS PENCIL NOTES: <span id="notes-indicator">OFF</span></span>
    </button>
  </div>

  <!-- Thumb Zone Controls with Digit Badges -->
  <div class="numpad">
    <button class="num-btn" data-num="1"><span class="btn-digit">1</span><span class="badge" id="badge-1">9</span></button>
    <button class="num-btn" data-num="2"><span class="btn-digit">2</span><span class="badge" id="badge-2">9</span></button>
    <button class="num-btn" data-num="3"><span class="btn-digit">3</span><span class="badge" id="badge-3">9</span></button>
    <button class="num-btn" data-num="4"><span class="btn-digit">4</span><span class="badge" id="badge-4">9</span></button>
    <button class="num-btn" data-num="5"><span class="btn-digit">5</span><span class="badge" id="badge-5">9</span></button>
    <button class="num-btn" data-num="6"><span class="btn-digit">6</span><span class="badge" id="badge-6">9</span></button>
    <button class="num-btn" data-num="7"><span class="btn-digit">7</span><span class="badge" id="badge-7">9</span></button>
    <button class="num-btn" data-num="8"><span class="btn-digit">8</span><span class="badge" id="badge-8">9</span></button>
    <button class="num-btn" data-num="9"><span class="btn-digit">9</span><span class="badge" id="badge-9">9</span></button>
    <button class="num-btn action-btn">ERASE [X]</button>
  </div>

  <!-- Win Screen Overlay -->
  <div class="win-overlay" id="win-screen">
    <div class="win-text">STAGE CLEAR</div>
    <div class="win-actions">
      <button class="play-again-btn" onclick="resetGame()">Play Again</button>
      <button class="play-again-btn btn-quit-gameover" onclick="quitToMenu()">Menu</button>
    </div>
  </div>
  
  <!-- Game Over Screen Overlay -->
  <div class="win-overlay" id="game-over-screen">
    <div class="win-text game-over-title">GAME OVER</div>
    <div class="game-over-actions">
      <button class="play-again-btn btn-continue" onclick="continueGame()">
        CONTINUE (<span id="continue-timer">9</span>)
      </button>
      <button class="play-again-btn btn-quit-gameover" onclick="quitToMenu()">
        QUIT
      </button>
    </div>
  </div>

  <!-- Quit Confirmation Modal Overlay -->
  <div class="win-overlay" id="quit-confirm-screen">
    <div class="win-text game-over-title">QUIT GAME?</div>
    <p class="confirm-subtitle">CURRENT GAME PROGRESS WILL BE LOST.</p>
    <div class="confirm-actions">
      <button class="play-again-btn btn-continue" onclick="closeQuitModal()">RESUME</button>
      <button class="play-again-btn btn-quit-gameover" onclick="confirmQuitToMenu()">QUIT TO MENU</button>
    </div>
  </div>

  <!-- Title Screen Overlay -->
  <div class="win-overlay active" id="title-screen">
    <!-- RETRO STACKED GAME LOGO HEADER -->
<div class="super-sudoku-logo">
  <span class="logo-line line-super">SUPER</span>
  <span class="logo-line line-sudoku">SUDOKU</span>
  <span class="logo-line line-arcade">ARCADE</span>
</div>

    <div class="mode-select-group">
      <button class="play-again-btn btn-easy" onclick="startGame(30, 600, 'easy')">EASY<br>(10:00)</button>
      <button class="play-again-btn btn-normal" onclick="startGame(45, 420, 'normal')">NORMAL<br>(07:00)</button>
      <button class="play-again-btn btn-hard" onclick="startGame(55, 180, 'hard')">HARD<br>(03:00)</button>
      <button class="play-again-btn btn-expert" onclick="startGame(60, 120, 'expert')">EXPERT<br>(02:00)</button>
      <button class="play-again-btn btn-radar" onclick="startGame(60, 180, 'radar')">RADAR<br>(03:00)</button>
    </div>
  </div>

</div> <!-- Close game-container -->

<script src="sudoku.js"></script>
</body>
</html>
